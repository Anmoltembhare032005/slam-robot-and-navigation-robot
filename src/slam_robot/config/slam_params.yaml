slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # Online async mode
    mode: mapping
    debug_logging: false
    transform_publish_period: 0.02
    map_update_interval: 1.0
    MinimumNumIters: 2
    MinimumTravelDistance: 0.15
    MinimumTravelHeading: 0.10
    Resolution: 0.05
    map_start_pose: [0.0, 0.0, 0.0]

    # Matching / loop closure
    MinimumTimeInterval: 0.5
    CancelThreadsOnExit: true
    enable_interactive_mode: true

    # Scan chain
    UseScanMatching: true
    UseScanBarycenter: true
    MinimumScanResponse: 5
    use_respawn: false

    # Scan matcher search window & slip recovery
    # Allows recovering true pose even when wheels slip against obstacles
    correlation_search_space_dimension: 0.8
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Motion model / penalties (lower penalties so scan matcher overrides slipping odom)
    angle_variance_penalty: 0.3
    minimum_angle_penalty: 0.7
    maximum_angle_penalty: 0.9
    minimum_distance_penalty: 0.3
    maximum_distance_penalty: 0.7

    # Loop closure search
    do_loop_closing: true
    loop_search_maximum_distance: 2.5
    loop_match_minimum_chain_size: 15
    loop_match_minimum_variance: 0.1
    loop_match_maximum_association_cloud_variance: 0.18

    # Neighborhood - / serialization
    serialize_pose_graph: false
    # (pose graph saved separately in stage 6)
    scan_queue_size: 20
    transform_timeout: 0.5
